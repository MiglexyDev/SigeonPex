<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: none;
    }
    #tree {
      width: min(70vw, 300px);
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 0 40px rgba(200, 0, 90, 0.55));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-14px) scale(1.03); }
    }
  </style>
</head>
<body>
  <img id="tree" src="tree.gif" alt="">
  <audio id="sfx" src="spooky.mp3" loop preload="auto"></audio>
  <script>
    const audio = document.getElementById('sfx');
    audio.volume = 0.75;

    function tryPlay() {
      audio.play().catch(() => {});
    }

    // Try immediately + on any interaction (browsers block autoplay)
    tryPlay();
    document.body.addEventListener('click', tryPlay);
    document.body.addEventListener('touchstart', tryPlay);
    document.body.addEventListener('keydown', tryPlay);
  </script>
</body>
</html>
